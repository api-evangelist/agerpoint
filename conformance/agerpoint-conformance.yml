domain_standards:
- id: ogc-wms
  conforms: gated
  evidence: >-
    The first-party console builds requests against ${cloudapi}/api/maps/wms and
    ${cloudapi}/api/maps/wms/shared. GET
    https://cloudapi.agerpoint.com/api/maps/wms?service=WMS&request=GetCapabilities returns HTTP 401
    (WWW-Authenticate: Bearer) rather than 404, so a WMS endpoint exists but its capabilities document
    is not publicly retrievable.
  note: No GetCapabilities XML was fetched, so none is recorded. Never generate an OGC contract.
- id: ogc-api-tiles
  conforms: gated
  evidence: >-
    https://tiles.agerpoint.com/healthz returns HTTP 200 with
    {"versions":{"titiler":"1.2.0","rasterio":"1.5.0","gdal":"3.12.1","proj":"9.7.1","geos":"3.14.1"}},
    identifying TiTiler 1.2.0, which implements OGC API - Tiles. The console requests
    https://tiles.agerpoint.com/cog/tiles/WebMercatorQuad/{z}/{x}/{y}@2x.png, naming the OGC
    WebMercatorQuad tile matrix set. GET https://tiles.agerpoint.com/conformance and /tileMatrixSets both
    return HTTP 403 "RBAC: access denied", so conformsTo[] could not be read.
- id: cloud-optimized-geotiff
  conforms: true
  evidence: >-
    The console's raster path is TiTiler's /cog/ prefix with a ?url= COG reference, and the tile service
    reports rasterio 1.5.0 / GDAL 3.12.1 — COG is the raster interchange format in use.
- id: geojson
  conforms: true
  evidence: >-
    The console uploads and renders .geojson (RFC 7946) FeatureCollections and maps them onto
    /api/GeometryCollections and /api/Geometries resources; .kml, .kmz, .csv/.tsv and .laz/.ply are also
    accepted upload formats.
- id: epsg-crs
  conforms: true
  evidence: >-
    Coordinates are handled in EPSG:4326 and rendered in EPSG:3857; PROJ 9.7.1 is reported by the tile
    service.
