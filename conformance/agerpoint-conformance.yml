source: >-
  https://agerpoint.us.auth0.com/.well-known/openid-configuration (200);
  https://cloudapi.agerpoint.com/api/Capture/{id} (401, WWW-Authenticate: Bearer);
  https://cloudapi.agerpoint.com/api/maps/wms?service=WMS&request=GetCapabilities (401);
  https://tiles.agerpoint.com/healthz (200); https://tiles.agerpoint.com/conformance (403);
