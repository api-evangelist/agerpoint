summary: >-
  Agerpoint makes no published conformance or compliance claims. Everything asserted below was
  established by probe. Two OGC surfaces demonstrably exist — an OGC Web Map Service at
  cloudapi.agerpoint.com/api/maps/wms and a TiTiler 1.2.0 raster-tile service at tiles.agerpoint.com
  serving the OGC WebMercatorQuad tile matrix set over Cloud Optimized GeoTIFF — but both are
  authorization-gated, so neither GetCapabilities nor /conformance could be retrieved. Per the
  no-fabrication rule, no OGC contract is recorded here or saved to conformance/ as a document; only the
  probe result is recorded.
conformance:
- id: oauth2
  conforms: true
  evidence: >-
