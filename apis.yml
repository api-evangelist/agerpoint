apis:
- name: Agerpoint Cloud API
  description: >-
    Live REST/JSON API behind Agerpoint Cloud and the Agerpoint Capture apps, served from
    cloudapi.agerpoint.com on ASP.NET Core (Kestrel). Resource families observed on the public
    first-party web client include Captures, Projects, Layers and LayerGroups, GeometryCollections,
    ImageMosaics, GSplatModels, Uploads, AnalyticRequests, CaptureExtractionJobs, MediaAnalysisPipelines,
    PipelineJobs, Plans, Collections, Customers, Roles and ResourceUsage. Every operation requires an
    OAuth 2.0 bearer token issued by the agerpoint.us.auth0.com tenant for the
    https://cloudapi.agerpoint.com audience; unauthenticated requests answer 401 with
    "WWW-Authenticate: Bearer". No OpenAPI, Swagger, GraphQL SDL, WSDL or MCP manifest is published at
    any public location, and there is no public developer portal or API reference.
  humanURL: https://www.agerpoint.com/platform
  baseURL: https://cloudapi.agerpoint.com
  image: https://static1.squarespace.com/static/606493cd17d20236b6ecab96/t/6a43fbdcb741a94a56e4ea61/1782840284360/ap-social-sharing-image.png?format=1500w
