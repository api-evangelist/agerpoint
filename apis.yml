aid: agerpoint
name: Agerpoint
description: >-
  Agerpoint is a spatial-intelligence company in Research Triangle Park, North Carolina that turns
  real-world field data into AI-derived crop, tree and land measurements. Its Capture mobile app builds
  full-resolution 3D digital twins of plants from a smartphone or tablet video, and Agerpoint Cloud — a
  spatial data management and analytics platform — fuses those captures with LiDAR, drone imagery,
  satellite data, sensors and equipment telemetry to derive plant metrics through a machine-learning
  pipeline for yield estimation, disease detection, carbon sequestration and biodiversity assessment.
  The platform is backed by a live REST API at cloudapi.agerpoint.com covering captures, projects,
  layers, geometry collections, image mosaics, Gaussian-splat models, analytic requests and pipeline
  jobs, secured by OAuth 2.0 / OIDC bearer tokens from an Auth0 tenant. That API is currently a
  customer-only surface: it powers the first-party console and mobile apps, and Agerpoint publishes no
  public developer portal, reference, or machine-readable contract for it. The company also sells
  API-integration and custom software development as professional services.
