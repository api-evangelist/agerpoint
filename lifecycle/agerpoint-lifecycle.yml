decay_signals:
- signal: dangling-dns
  host: api.agerpoint.com
  detail: >-
    api.agerpoint.com is a CNAME to agerapi.azurewebsites.net, which no longer resolves (NXDOMAIN). The
    Azure App Service it pointed at has been deleted while the DNS record was left in place. The live API
    now runs at cloudapi.agerpoint.com (CNAME apc-api-production.azurewebsites.net). A dangling CNAME to
    an unclaimed *.azurewebsites.net name is also a subdomain-takeover exposure.
  probed: '2026-09-12'
  evidence: 'dig api.agerpoint.com -> CNAME agerapi.azurewebsites.net; dig agerapi.azurewebsites.net -> no answer'
